[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-subagent-lease-scheduler"
version = "0.1.0"
description = "Priority-weighted fair-share compute scheduler and lease coordinator for subagent swarms"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-subagent-lease-scheduler = "agent_subagent_lease_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_subagent_lease_scheduler*"]
